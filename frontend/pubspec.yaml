name: frontend
description: Historia mobile app frontend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  google_sign_in: 6.3.0
  provider: ^6.1.5+1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  http: ^1.6.0
  stomp_dart_client: ^3.0.1
  geolocator: ^14.1.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
