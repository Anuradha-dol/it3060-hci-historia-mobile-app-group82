spring:
  config:
    import:
      - optional:file:./src/main/resources/application-local.yml
      - optional:file:./src/main/resources/application-local.yaml
      - optional:file:./backend/src/main/resources/application-local.yml
      - optional:file:./backend/src/main/resources/application-local.yaml

  application:
    name: backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 250MB
      max-request-size: 500MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/historia}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 15000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8081

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

cookie:
  secure: false
  same-site: Lax
